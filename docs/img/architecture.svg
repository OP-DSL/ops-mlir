<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
    <style>
      .box { fill: #f4f6fa; stroke: #5a6b8c; stroke-width: 1.5; rx: 6; }
      .new { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 6; }
      .ops { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1.5; rx: 6; }
      .gpu { fill: #ede7f6; stroke: #5e35b1; stroke-width: 1.5; rx: 6; }
      .t { fill: #222; }
      .h { font-weight: bold; font-size: 14px; }
      .s { font-size: 11.5px; fill: #444; }
      .arrow { stroke: #444; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .dash { stroke: #888; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; marker-end: url(#arr); }
      @media (prefers-color-scheme: dark) {
        .box { fill: #22283a; stroke: #8fa3cc; } .new { fill: #1d3a22; stroke: #66bb6a; }
        .ops { fill: #3b2a14; stroke: #ffa726; } .gpu { fill: #2a2340; stroke: #9575cd; }
        .t { fill: #eee; } .s { fill: #bbb; } .arrow { stroke: #ccc; } .dash { stroke: #999; }
        marker path { fill: #ccc; } rect.bg { fill: #121212; }
      }
    </style>
  </defs>
  <rect class="bg" width="980" height="900" fill="white"/>

  <text x="490" y="26" text-anchor="middle" class="t h" font-size="17">ops-mlir: from ops_par_loop to fused kernels</text>
  <text x="490" y="44" text-anchor="middle" class="s">green = added by lazy execution / fusion; orange = stock OPS; purple = device</text>

  <!-- Application -->
  <rect class="box" x="230" y="62" width="520" height="62"/>
  <text x="490" y="84" text-anchor="middle" class="t h">Application (OPS C++ API)</text>
  <text x="490" y="103" text-anchor="middle" class="s">ops_decl_block/dat/stencil/const · ops_par_loop(kernel, range, args…)</text>
  <text x="490" y="117" text-anchor="middle" class="s">ops_halo_transfer · ops_dat_fetch_data · ops_reduction_result · ops_exit</text>

  <!-- Wrapper -->
  <rect class="new" x="230" y="158" width="520" height="74"/>
  <text x="490" y="180" text-anchor="middle" class="t h">include/ops/OPSWrapper.h — interception</text>
  <text x="490" y="199" text-anchor="middle" class="s">ops_par_loop template → JITEngine::enqueueParLoop (kernel body is NOT run)</text>
  <text x="490" y="215" text-anchor="middle" class="s">host-access macros: flush the queue, copy the dat back from the GPU</text>

  <!-- stock OPS -->
  <rect class="ops" x="780" y="158" width="190" height="74"/>
  <text x="875" y="182" text-anchor="middle" class="t h">OPS core (stock)</text>
  <text x="875" y="200" text-anchor="middle" class="s">declarations, halo exchange,</text>
  <text x="875" y="215" text-anchor="middle" class="s">HDF5, timers, ops_exit</text>

  <!-- Queue -->
  <rect class="new" x="230" y="268" width="520" height="92"/>
  <text x="490" y="290" text-anchor="middle" class="t h">JITEngine — lazy queue of LoopDesc</text>
  <text x="490" y="309" text-anchor="middle" class="s">dats, stencils, ranges, access modes · read-only globals copied at enqueue</text>
  <text x="490" y="325" text-anchor="middle" class="s">flush on: compile_and_execute · host access · halo transfer · exit · queue cap</text>
  <text x="490" y="345" text-anchor="middle" class="s">stats(): loops / launches / flushes / compiles</text>

  <!-- Planner -->
  <rect class="new" x="40" y="400" width="400" height="118"/>
  <text x="240" y="422" text-anchor="middle" class="t h">FusionPlanner (pure C++)</text>
  <text x="240" y="441" text-anchor="middle" class="s">1 footprints → dependence DAG (RAW / WAR / WAW)</text>
  <text x="240" y="457" text-anchor="middle" class="s">2 place each loop into a legal kernel (acyclic)</text>
  <text x="240" y="473" text-anchor="middle" class="s">3 guarded bounding box for differing ranges</text>
  <text x="240" y="489" text-anchor="middle" class="s">4 emit kernels in topological order</text>
  <text x="240" y="507" text-anchor="middle" class="s">→ FusionPlan { groups[ loops, box, guarded ] }</text>

  <!-- Cache -->
  <rect class="new" x="540" y="400" width="400" height="118"/>
  <text x="740" y="422" text-anchor="middle" class="t h">Module cache</text>
  <text x="740" y="441" text-anchor="middle" class="s">key = loop shapes (kernels, ranges, accesses,</text>
  <text x="740" y="457" text-anchor="middle" class="s">dat shapes/types, stencils) + plan digest</text>
  <text x="740" y="477" text-anchor="middle" class="s">hit  → execute the cached ExecutionEngine</text>
  <text x="740" y="493" text-anchor="middle" class="s">miss → compile (below), then execute</text>

  <!-- compile pipeline -->
  <text x="490" y="552" text-anchor="middle" class="t h">compile (cache miss)</text>
  <rect class="box" x="40" y="562" width="190" height="86"/>
  <text x="135" y="584" text-anchor="middle" class="t h">IRBuilder</text>
  <text x="135" y="602" text-anchor="middle" class="s">one ops.par_loop per loop</text>
  <text x="135" y="618" text-anchor="middle" class="s">+ fuse_group attribute</text>

  <rect class="new" x="265" y="562" width="215" height="86"/>
  <text x="372" y="584" text-anchor="middle" class="t h">xDSL (embedded Python)</text>
  <text x="372" y="602" text-anchor="middle" class="s">OPSToStencilPass.convert_group</text>
  <text x="372" y="618" text-anchor="middle" class="s">one stencil.apply per group</text>
  <text x="372" y="634" text-anchor="middle" class="s">→ scf.parallel / memref</text>

  <rect class="new" x="515" y="562" width="200" height="86"/>
  <text x="615" y="584" text-anchor="middle" class="t h">KernelIRBuilder</text>
  <text x="615" y="602" text-anchor="middle" class="s">clang AST of the kernel</text>
  <text x="615" y="618" text-anchor="middle" class="s">→ arith / math (f32 or f64)</text>
  <text x="615" y="634" text-anchor="middle" class="s">strict mode: no hidden upcasts</text>

  <rect class="box" x="750" y="562" width="190" height="86"/>
  <text x="845" y="584" text-anchor="middle" class="t h">BackendPipeline</text>
  <text x="845" y="602" text-anchor="middle" class="s">inline kernels, lower</text>
  <text x="845" y="618" text-anchor="middle" class="s">seq · OpenMP · CUDA</text>
  <text x="845" y="634" text-anchor="middle" class="s">→ LLVM IR / PTX</text>

  <!-- execute -->
  <rect class="new" x="230" y="688" width="520" height="92"/>
  <text x="490" y="710" text-anchor="middle" class="t h">JITEngine::execute — one launch per kernel, in plan order</text>
  <text x="490" y="729" text-anchor="middle" class="s">args = distinct dats (by ops_dat index), then the captured global values</text>
  <text x="490" y="745" text-anchor="middle" class="s">CUDA: allocate / copy device buffers, mark written dats host-dirty</text>
  <text x="490" y="761" text-anchor="middle" class="s">synchronize · profile (kernel name = fused(k1+k2+…))</text>

  <rect class="gpu" x="230" y="812" width="250" height="56"/>
  <text x="355" y="836" text-anchor="middle" class="t h">CPU: LLVM ExecutionEngine</text>
  <text x="355" y="854" text-anchor="middle" class="s">seq loops / OpenMP parallel</text>
  <rect class="gpu" x="500" y="812" width="250" height="56"/>
  <text x="625" y="836" text-anchor="middle" class="t h">GPU: CUDA driver</text>
  <text x="625" y="854" text-anchor="middle" class="s">one gpu.launch per fused kernel</text>

  <!-- arrows -->
  <path class="arrow" d="M490,124 L490,158"/>
  <path class="arrow" d="M490,232 L490,268"/>
  <path class="dash" d="M750,195 L780,195"/>
  <path class="arrow" d="M410,360 L280,400"/>
  <path class="arrow" d="M440,459 L540,459"/>
  <path class="arrow" d="M570,360 L700,400"/>
  <path class="arrow" d="M230,605 L265,605"/>
  <path class="arrow" d="M480,605 L515,605"/>
  <path class="arrow" d="M715,605 L750,605"/>
  <path class="arrow" d="M135,518 L135,562"/>
  <path class="arrow" d="M845,648 L700,688"/>
  <path class="arrow" d="M490,780 L355,812"/>
  <path class="arrow" d="M490,780 L625,812"/>
  <path class="dash" d="M540,474 C 500,560 500,640 500,688"/>
  <text x="508" y="672" class="s">cache hit</text>
  <text x="300" y="388" class="s">plan</text>
  <text x="662" y="388" class="s">key</text>
</svg>
